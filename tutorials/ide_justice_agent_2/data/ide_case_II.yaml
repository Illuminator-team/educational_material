scenario:
  name: "IDE Justice Agent Test Case II"
  start_time: '2012-01-01 00:00:00' # ISO 8601 start time of the simulation
  end_time: '2012-12-01 06:45:00' # ISO 8601 end time of the simulation (one year later)
  # time_resolution: 2592000 # one month in seconds lol
  time_resolution: 1296000 # 2 weeks in seconds

models:
  - name: Justice_Controller
    type: JusticeAgentControllerCorridor
    parameters:
      houses: 5
      # Flowchart Thresholds
      sufficiency_floor: 70
      sufficiency_ceiling: 120
      capability_threshold: 0.5 # tau for mismatch monitoring
    inputs:
      consumption: []
      production: []
      response: [] # Input from households to monitor capability
    outputs:
      recommendations:
      hub_state: # Scarcity, Inequality, Extravagance, or Sufficiency
      usage_rate:
      capabilities: 

  - name: Neighborhood_A
    type: New_House_Type_Comm
    parameters:
      houses: 5
      # Static base values (kWh per 2 weeks)
      consumption: [175.0, 16.8, 137.2, 7.0, 28.0]
      production: [11.2, 35.0, 42.0, 21.0, 7.0]

      alphas: [0.1, 0.5, 0.2, 0.8, 0.3] 
      betas: [0.05, 0.2, 0.1, 0.4, 0.1] 
      decision_threshold: 0.55
      incentive_weights: [
        [0.1, 0.1, 0.8],
        [0.1, 0.8, 0.1],
        [0.8, 0.1, 0.1],
        [0.33, 0.33, 0.34],
        [0.5, 0.0, 0.5]
      ]
    inputs:
      recommendations: []
    outputs:
      sum_load_dem:
      sum_consumption:
      sum_production:
      consumption:
      production:
      response: # Tracks [accepted_count, total_assigned] per house

connections:
  # State Feedback
  - from: Neighborhood_A.consumption
    to: Justice_Controller.consumption
    
  - from: Neighborhood_A.production
    to: Justice_Controller.production

  # System Checker / Capability Monitoring
  - from: Neighborhood_A.response
    to: Justice_Controller.response

  # Control Loop
  - from: Justice_Controller.recommendations
    to: Neighborhood_A.recommendations
    time_shifted: True

monitor:
  file: './out_justice_corridor.csv'
  items:
    - Justice_Controller.hub_state
    - Justice_Controller.usage_rate
    - Justice_Controller.recommendations
    - Justice_Controller.capabilities
    - Neighborhood_A.consumption
    - Neighborhood_A.production
    - Neighborhood_A.response
    - Neighborhood_A.sum_consumption
    - Neighborhood_A.sum_production
  